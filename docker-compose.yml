services:
  backend:
    build: ./backend
    container_name: aura-backend
    env_file:
      - ./backend/.env
    environment:
      - CORS_ORIGINS=https://aura.hallia.ai,https://backend-aura.hallia.ai
      - PYTHONIOENCODING=utf-8
      - PYTHONUNBUFFERED=1
    ports:
      - "8001:8000"
    volumes:
      - ./openwake:/openwake:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/stt-token')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
